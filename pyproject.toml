[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gerrymandering-ensemble-analysis"
version = "0.1.0"
description = "Compactness, partisan-metric, and redistricting-ensemble analysis for Michigan and Missouri."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "gerrychain>=0.3",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyproj>=3.6",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
