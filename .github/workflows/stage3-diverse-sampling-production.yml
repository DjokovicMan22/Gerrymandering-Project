name: Stage 3 explicit-RNG diversified-start matched-budget production

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-diverse-sampling-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separate-warmup-and-sample:
    name: ${{ matrix.condition }} warm ${{ matrix.warm_seed }} sample ${{ matrix.sample_seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {condition: closer, cut: 760, counties: 18, mcd: 20, warm_seed: 101, sample_seed: 1101, hash: "a1cb09ace3596f11531170c14d8ed18a125d0acd7404cccb15df61956ddfa910"}
          - {condition: closer, cut: 760, counties: 18, mcd: 20, warm_seed: 202, sample_seed: 1202, hash: "1bfdc79ef1ed8862cb1ac03bbcfe9cae02ba923128c9784dce56cc050b9112e0"}
          - {condition: closer, cut: 760, counties: 18, mcd: 20, warm_seed: 303, sample_seed: 1303, hash: "a9b814df23174fe527663ad7716f1a1eb7cb9d7c5fa442583110841f574a3f57"}
          - {condition: closer, cut: 760, counties: 18, mcd: 20, warm_seed: 404, sample_seed: 1404, hash: "a03356fe60f4e8dd6ce5a3a43aba1cd124c93e452d4f482b7543e8e78be999ee"}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, warm_seed: 101, sample_seed: 1101, hash: "fa6d219689c0fe1d47c1306bfb10a81cea59c1dd150be27e4f480ded14cf4287"}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, warm_seed: 202, sample_seed: 1202, hash: "031abb8e1e1d7fdd58ea39193482c9d87da34b062646d7fcb24eb5c3e563cdf8"}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, warm_seed: 303, sample_seed: 1303, hash: "0c8bf4b74a734f175cbaf61423f6630cd4736fb376b094f5c55198f55821e452"}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, warm_seed: 404, sample_seed: 1404, hash: "7b8a3989e54ec9cc9dd30824db727bd365e9fca2c7e1ec57cad24c6712c7fb2b"}
    env:
      CONDITION: ${{ matrix.condition }}
      CUT: ${{ matrix.cut }}
      COUNTIES: ${{ matrix.counties }}
      MCD: ${{ matrix.mcd }}
      WARM_SEED: ${{ matrix.warm_seed }}
      SAMPLE_SEED: ${{ matrix.sample_seed }}
      WARM_HASH: ${{ matrix.hash }}
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned project and save dependency versions
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip freeze > pinned-runtime.txt
          python -m compileall -q src/redistricting/ensemble scripts/research_audit
      - name: Fetch exact nonredistributed source and verify precinct integrity
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python scripts/research_audit/verify_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --expected-git-blob a4dfe70818f87b97924781216f3d86a672cfc66a \
            --expected-nodes 4756 --expected-population 10077331 \
            --output "outputs/research_audit/diverse_prod/mi_source_${CONDITION}_${WARM_SEED}.json"
      - name: Reproduce exact independently validated seeded warm start then run 4001 sampled states
        run: |
          python scripts/research_audit/run_diversified_chains.py \
            --graph data/raw/mi/mi/mi.json \
            --output-root outputs/research_audit/diverse_prod \
            --condition "$CONDITION" \
            --warm-seed "$WARM_SEED" --sample-seed "$SAMPLE_SEED" \
            --warm-steps 800 --steps 4001 --burn-in 1000 \
            --snapshot-interval 50 --epsilon 0.005 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --expected-warm-hash "$WARM_HASH" \
            --min-initial-distance 0.05
      - name: Independently check 81 archived sampled assignments and four scalar/geographic constraints
        run: |
          STEM="mi_2020_diverse_${CONDITION}_warm${WARM_SEED}_sample${SAMPLE_SEED}_4001steps"
          CHAIN_DIR=outputs/research_audit/diverse_prod/chains
          python scripts/research_audit/verify_snapshots.py \
            --graph data/raw/mi/mi/mi.json --epsilon 0.005 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --assignments "$CHAIN_DIR/${STEM}_assignments.json" \
            --metric-files "$CHAIN_DIR/${STEM}_plan_metrics.csv" \
            --output "outputs/research_audit/diverse_prod/reports/${STEM}_verified.csv"
      - name: Upload source hashes and derived metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-diverse-prod-${{ matrix.condition }}-${{ matrix.warm_seed }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            pinned-runtime.txt
            outputs/research_audit/diverse_prod/mi_source_*.json
            outputs/research_audit/diverse_prod/chains/*_plan_metrics.csv
            outputs/research_audit/diverse_prod/chains/*_metadata.json
            outputs/research_audit/diverse_prod/reports/*_reference.json
            outputs/research_audit/diverse_prod/reports/*_audit.json
            outputs/research_audit/diverse_prod/reports/*_summary.csv
            outputs/research_audit/diverse_prod/reports/*_spatial_probes.csv
            outputs/research_audit/diverse_prod/reports/*_verified.csv

  matched-crosschain:
    name: Matched-budget R-hat/ESS against separately scored enacted reference
    needs: separate-warmup-and-sample
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight diagnostics
        run: python -m pip install --disable-pip-version-check numpy pandas arviz
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-diverse-prod-*
          merge-multiple: true
          path: downloaded
      - name: Enforce exact cohort completeness and calculate diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/research_audit/diverse_prod/aggregated
          results_bad=0
          for condition in closer relaxed; do
            mapfile -t chains < <(find downloaded -type f -name "mi_2020_diverse_${condition}_warm*_plan_metrics.csv" | sort)
            mapfile -t metas < <(find downloaded -type f -name "mi_2020_diverse_${condition}_warm*_metadata.json" | sort)
            mapfile -t refs < <(find downloaded -type f -name "mi_2020_diverse_${condition}_warm*_reference.json" | sort)
            if [ "${#chains[@]}" -ne 4 ] || [ "${#metas[@]}" -ne 4 ] || [ "${#refs[@]}" -ne 4 ]; then
              echo "INCOMPLETE: $condition expected 4 chain CSVs, metadata JSON and reference JSON each" >&2
              exit 1
            fi
            set +e
            python scripts/research_audit/analyze_diversified_chains.py \
              --chains "${chains[@]}" --metadata "${metas[@]}" \
              --references "${refs[@]}" --condition "$condition" \
              --burn-in 1000 --epsilon 0.005 \
              --out "outputs/research_audit/diverse_prod/aggregated/$condition"
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              echo "NOT CERTIFIED: scalar convergence requirements failed for $condition"
              results_bad=1
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            echo "### Michigan diverse-start $condition" >> "$GITHUB_STEP_SUMMARY"
            echo "The chain start is a seeded warmup map; enacted reference is scored from separate identical JSON files." >> "$GITHUB_STEP_SUMMARY"
            cat "outputs/research_audit/diverse_prod/aggregated/$condition/scalar_diagnostics.csv" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$results_bad" -eq 1 ]; then
            echo "SCALAR_DIAGNOSTICS_FAILED_NOT_CERTIFIED" > outputs/research_audit/diverse_prod/aggregated/verdict.txt
          else
            echo "SCALAR_DIAGNOSTICS_PASSED_STATIONARY_LAW_AND_GEOGRAPHY_NOT_CERTIFIED" > outputs/research_audit/diverse_prod/aggregated/verdict.txt
          fi
      - name: Upload cross-chain scalar convergence and cohort audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-diversified-aggregate-rhat-ess
          retention-days: 90
          if-no-files-found: warn
          path: outputs/research_audit/diverse_prod/aggregated/
