name: Stage 3 matched-budget Michigan ReCom production

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-seeded-chains:
    name: epsilon ${{ matrix.epsilon }}, seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        epsilon: [0.005, 0.02]
        seed: [101, 202, 303, 404]
    env:
      EPSILON: ${{ matrix.epsilon }}
      SEED: ${{ matrix.seed }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned-project research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" arviz
          python -m pip freeze > outputs-dependencies.txt
      - name: Fetch and verify public Michigan graph, without redistributing raw data
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          mkdir -p outputs/research_audit/production
          python scripts/research_audit/verify_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --expected-git-blob a4dfe70818f87b97924781216f3d86a672cfc66a \
            --expected-nodes 4756 --expected-population 10077331 \
            --output outputs/research_audit/production/source_seed_${SEED}_eps_${EPSILON}.json
      - name: Run 8000 recorded GerryChain states with 2000-state diagnostic burn-in
        shell: bash
        run: |
          set -euo pipefail
          EPSTAG="${EPSILON//./p}"
          CHAIN_ID="stage3eps${EPSTAG}_chain${SEED}"
          python scripts/run_baseline.py \
            --state mi --election 2020 \
            --epsilon "$EPSILON" --seed "$SEED" \
            --steps 8000 --chain-id "$CHAIN_ID" \
            --snapshot-interval 10
      - name: Independently validate every saved full assignment and reconcile the original CSV
        shell: bash
        run: |
          set -euo pipefail
          EPSTAG="${EPSILON//./p}"
          STEM="mi_2020_stage3eps${EPSTAG}_chain${SEED}_8000steps_seed${SEED}"
          CHAIN_DIR="outputs/chains/week4"
          python scripts/research_audit/verify_snapshots.py \
            --graph data/raw/mi/mi/mi.json \
            --epsilon "$EPSILON" \
            --assignments "$CHAIN_DIR/${STEM}_assignments.json" \
            --metric-files "$CHAIN_DIR/${STEM}_plan_metrics.csv" \
            --output "outputs/research_audit/production/validated_seed_${SEED}_eps_${EPSILON}.csv"
      - name: Upload derived scores and verification only; exclude source graph and full precinct assignments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-prod-eps-${{ matrix.epsilon }}-seed-${{ matrix.seed }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            outputs-dependencies.txt
            outputs/research_audit/production/**
            outputs/chains/week4/mi_2020_stage3eps*_plan_metrics.csv
            outputs/chains/week4/mi_2020_stage3eps*_metadata.json

  aggregate-diagnostics:
    name: Cross-chain convergence, ESS, conditional tails
    needs: independent-seeded-chains
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis-only packages
        run: python -m pip install --disable-pip-version-check pandas numpy arviz
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-prod-*
          merge-multiple: true
          path: downloaded
      - name: Calculate independent cross-chain diagnostics for matched budgets
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for epsilon in 0.005 0.02; do
            eps_tag="${epsilon//./p}"
            mapfile -t files < <(find downloaded/chains/week4 -name "mi_2020_stage3eps${eps_tag}_chain*_plan_metrics.csv" -type f | sort)
            if [ "${#files[@]}" -ne 4 ]; then
              echo "Expected four chain scores for epsilon $epsilon, found ${#files[@]}" >&2
              exit 1
            fi
            set +e
            python scripts/research_audit/analyze_chains.py \
              --chains "${files[@]}" --burn-in 2000 \
              --epsilon "$epsilon" \
              --out "outputs/research_audit/production/epsilon_${epsilon}"
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              failed=1
              echo "CONVERGENCE GATE FAILED for epsilon=$epsilon; preserve outputs, do NOT publish as stationary results."
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "NOT CERTIFIED: at least one scalar convergence gate failed." | tee outputs/research_audit/production/convergence_status.txt
          else
            echo "Scalar convergence gates passed; geographic and high-dimensional validity NOT certified." | tee outputs/research_audit/production/convergence_status.txt
          fi
      - name: Preserve cross-chain diagnostics and source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-production-crosschain-diagnostics
          retention-days: 90
          if-no-files-found: warn
          path: outputs/research_audit/production/**
