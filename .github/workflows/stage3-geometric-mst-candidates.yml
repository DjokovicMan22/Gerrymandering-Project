name: Stage 3 spatially nearest original disconnected component bridge proposals

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-geometric-mst-candidates.yml
      - scripts/research_audit/propose_geometry_bridges.py
      - scripts/research_audit/geometry_bridge_validation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-proximity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned GerryChain and geospatial dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install geopandas pyogrio "shapely>=2.0"
          python -m compileall -q scripts/research_audit/propose_geometry_bridges.py
      - name: Fetch and strictly verify unmodified original precinct JSON and ZIP package
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python - <<'PY'
          import hashlib,urllib.request,pathlib
          url="https://raw.githubusercontent.com/eveomett-states/Michigan/main/mi.zip"
          data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"research-audit-precinct-geometry"}),timeout=120).read()
          sha=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()
          if sha!="07bce18dabbcca9d549e28995a8156fd6978d7db":
              raise ValueError(f"Unexpected third-party original geometry bytes: {sha}")
          path=pathlib.Path("data/raw/mi/original_precincts.zip")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
          PY
      - name: Build exact projected-distance minimum spanning tree without inspecting district labels
        run: |
          python scripts/research_audit/propose_geometry_bridges.py \
            --graph data/raw/mi/mi/mi.json \
            --zip data/raw/mi/original_precincts.zip \
            --output outputs/research_audit/precinct_nearest_component_bridges.json
      - name: Upload proposed edges and distances with no false legal certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-geometry-minimum-distance-component-mst
          retention-days: 90
          path: outputs/research_audit/precinct_nearest_component_bridges.json
