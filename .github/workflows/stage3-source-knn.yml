name: Stage 3 label-blind KNN source geometry sensitivity

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-source-knn.yml
      - scripts/research_audit/geometric_knn_sensitivity.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knn-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible GIS environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install geopandas pyogrio "shapely>=2.0"
      - name: Verify graph and original polygon ZIP file against known source Git blobs
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          url="https://raw.githubusercontent.com/eveomett-states/Michigan/main/mi.zip"
          blob=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"research-geospatial"}),timeout=120).read()
          sha=hashlib.sha1(b"blob "+str(len(blob)).encode()+b"\x00"+blob).hexdigest()
          assert sha=="07bce18dabbcca9d549e28995a8156fd6978d7db",sha
          path=pathlib.Path("data/raw/mi/original_precincts.zip")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(blob)
          PY
      - name: Verify source-polygon alignment and KNN sensitivity to reference district connectivity
        run: |
          python scripts/research_audit/geometric_knn_sensitivity.py \
            --graph data/raw/mi/mi/mi.json \
            --zip data/raw/mi/original_precincts.zip \
            --ks 1 3 10 25 50 \
            --out outputs/research_audit/knn_topology_sensitivity.json
      - name: Archive derived graph-sensitivity diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-label-independent-knn-island-model
          retention-days: 90
          path: outputs/research_audit/knn_topology_sensitivity.json
