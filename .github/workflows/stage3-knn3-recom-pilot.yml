name: Stage 3 source-reconciled geographic topology ReCom pilot

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-knn3-recom-pilot.yml
      - scripts/research_audit/build_geometric_knn_graph.py
      - scripts/run_baseline.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-matched-knn3:
    name: ${{ matrix.condition }} seed ${{ matrix.seed }} geometry K3
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {condition: closer, seed: 101, cut: 760, counties: 18, mcd: 20}
          - {condition: closer, seed: 202, cut: 760, counties: 18, mcd: 20}
          - {condition: relaxed, seed: 101, cut: 850, counties: 24, mcd: 49}
          - {condition: relaxed, seed: 202, cut: 850, counties: 24, mcd: 49}
    env:
      CONDITION: ${{ matrix.condition }}
      SEED: ${{ matrix.seed }}
      CUT: ${{ matrix.cut }}
      COUNTIES: ${{ matrix.counties }}
      MCD: ${{ matrix.mcd }}
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned ensemble code and source geometry dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install geopandas pyogrio "shapely>=2.0"
          python -m pip freeze > pinned-runtime.txt
          python -m compileall -q scripts/research_audit/build_geometric_knn_graph.py scripts/run_baseline.py
      - name: Obtain and independently hash-match original 2020 Michigan precinct graph and polygons
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python - <<'PY'
          import hashlib,urllib.request,pathlib
          url="https://raw.githubusercontent.com/eveomett-states/Michigan/main/mi.zip"
          b=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"stage3-independent-topology-audit"}),timeout=120).read()
          h=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\x00"+b).hexdigest()
          if h!="07bce18dabbcca9d549e28995a8156fd6978d7db":
            raise ValueError("Upstream source polygon ZIP drifted")
          p=pathlib.Path("data/raw/mi/original_precincts.zip")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(b)
          PY
      - name: Rebuild district-label-blind connected proximity graph; validate enacted map before sampling
        run: |
          python scripts/research_audit/build_geometric_knn_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --zip data/raw/mi/original_precincts.zip \
            --k 3 \
            --out-graph data/raw/mi/mi/mi_knn3.json \
            --out-manifest outputs/research_audit/knn3_pilot_${CONDITION}_seed${SEED}_topology.json
      - name: Execute 501 seeded ReCom model states; compare geographic fragmentation
        run: |
          python scripts/run_baseline.py \
            --state mi --graph-path data/raw/mi/mi/mi_knn3.json \
            --steps 501 --epsilon 0.005 --seed "$SEED" \
            --snapshot-interval 10 \
            --chain-id "geo_knn3_${CONDITION}_seed${SEED}" \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD"
      - name: Independently revalidate 51 complete sampled plans and source-matched graph metrics
        run: |
          STEM="mi_2020_geo_knn3_${CONDITION}_seed${SEED}_501steps_seed${SEED}"
          DIR=outputs/chains/week4
          python scripts/research_audit/verify_snapshots.py \
            --graph data/raw/mi/mi/mi_knn3.json --epsilon 0.005 \
            --max-cut-edges "$CUT" --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --assignments "$DIR/${STEM}_assignments.json" \
            --metric-files "$DIR/${STEM}_plan_metrics.csv" \
            --output "outputs/research_audit/${STEM}_validated.csv"
          python - <<'PY'
          import pandas as pd,os,json
          cond,seed=os.environ["CONDITION"],os.environ["SEED"]
          stem=f"mi_2020_geo_knn3_{cond}_seed{seed}_501steps_seed{seed}"
          df=pd.read_csv(f"outputs/chains/week4/{stem}_plan_metrics.csv")
          x=df.iloc[100:]
          result={
            "condition":cond,"seed":int(seed),
            "states":len(df),"post_initial_100":len(x),
            "reference_cut_edges":int(df.iloc[0]["cut_edges"]),
            "post_mean_cut_edges":float(x["cut_edges"].mean()),
            "post_mean_dem_seats":float(x["dem_seats"].mean()),
            "post_mean_efficiency_gap":float(x["efficiency_gap"].mean()),
            "post_mean_split_counties":float(x["split_counties"].mean()),
            "post_mean_split_county_mcd":float(x["split_county_mcd"].mean()),
            "proposed_changes":int(df["state_changed_since_previous"].sum()),
            "nonstationary_caution":"Correlated seeded finite-horizon ReCom model, not validated legal plan probabilities"
          }
          path=f"outputs/research_audit/{stem}_summary.json"
          open(path,"w").write(json.dumps(result,indent=2))
          print("KNN3_GEOSOURCE_PILOT",result)
          PY
      - name: Upload only source-graph hashes, derived scores, geographic audit and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-geometric-knn3-recom-${{ matrix.condition }}-${{ matrix.seed }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            pinned-runtime.txt
            outputs/research_audit/knn3_pilot_*.json
            outputs/research_audit/mi_2020_geo_knn3_*_summary.json
            outputs/research_audit/mi_2020_geo_knn3_*_validated.csv
            outputs/chains/week4/mi_2020_geo_knn3_*_plan_metrics.csv
            outputs/chains/week4/mi_2020_geo_knn3_*_metadata.json
