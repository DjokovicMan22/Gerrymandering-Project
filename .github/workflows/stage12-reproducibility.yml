name: Stage 1-2 archive and source reproducibility

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage12-reproducibility.yml
      - scripts/research_audit/stage12_*
      - tests/test_stage12_audit.py
      - src/redistricting/ensemble/partition.py
      - docs/data_provenance.md
      - docs/data_sources.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned analysis environment
        run: |
          python -m pip install numpy pandas networkx scipy pytest gerrychain==1.0.0
      - name: Inventory original research packet without redistributing it
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path('strong_paper_review_packet.zip')
          assert p.exists(), 'Original archived research packet is missing'
          with ZipFile(p) as z:
              names=z.namelist()
          print('ORIGINAL_PACKET_FILE_COUNT',len(names))
          for name in names:
              if 'chain' in name.lower() or 'week4' in name.lower() or 'week6' in name.lower() or 'stage2' in name.lower():
                  print('PACKET_ENTRY',name)
          PY
      - name: Reproduce Stage 2 historical chain metrics from the checked-in original ZIP
        run: |
          if [ -f scripts/research_audit/stage12_archive_reanalysis.py ]; then
            python scripts/research_audit/stage12_archive_reanalysis.py --packet strong_paper_review_packet.zip --output outputs/research_audit/stage12_archive.json
          fi
      - name: Verify upstream Michigan graph bytes and validate all input fields
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python scripts/research_audit/verify_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --expected-git-blob a4dfe70818f87b97924781216f3d86a672cfc66a \
            --expected-nodes 4756 --expected-population 10077331 \
            --output outputs/research_audit/stage12_verified_graph.json
      - name: Independently rescore all 13 enacted districts against six original archive references
        run: |
          python scripts/research_audit/stage12_reference_crosscheck.py \
            --graph data/raw/mi/mi/mi.json \
            --packet strong_paper_review_packet.zip \
            --output outputs/research_audit/stage12_reference_reconciliation.json
      - name: Run Stage 1-2 adversarial tests
        run: |
          if [ -f tests/test_stage12_audit.py ]; then
            PYTHONPATH=src python -m pytest tests/test_stage12_audit.py -q
          fi
      - name: Preserve independent verification manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-reproducibility-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            outputs/research_audit/stage12_archive.json
            outputs/research_audit/stage12_reference_reconciliation.json
            outputs/research_audit/stage12_verified_graph.json
            data/raw/mi/mi/mi.json.provenance.json

  independent-compactness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent GIS scoring dependencies
        run: python -m pip install numpy pandas networkx geopandas pyogrio shapely gerrychain
      - name: Verify exact original JSON graph and polygon ZIP source blobs
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          url='https://raw.githubusercontent.com/eveomett-states/Michigan/main/mi.zip'
          raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'independent-compactness-source-check'}),timeout=120).read()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
          if blob!='07bce18dabbcca9d549e28995a8156fd6978d7db':
              raise ValueError('Original precinct ZIP changed: '+blob)
          out=pathlib.Path('data/raw/mi/original_precincts.zip')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(raw)
          PY
      - name: Independently dissolve 13 precinct groups and recompute compactness
        run: |
          PYTHONPATH=src python scripts/research_audit/stage12_compactness_crosscheck.py \
            --graph data/raw/mi/mi/mi.json \
            --zip data/raw/mi/original_precincts.zip \
            --table outputs/tables/week2/mi_compactness_metrics.csv \
            --output outputs/research_audit/stage12_independent_compactness.json
      - name: Preserve independent GIS comparison (never source polygon bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-independent-compactness
          retention-days: 90
          if-no-files-found: warn
          path: outputs/research_audit/stage12_independent_compactness.json
