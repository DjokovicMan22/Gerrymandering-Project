name: Stage 3 verified precinct polygon geometry and bridge audit

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-precinct-geometry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data-science GIS environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install geopandas pyogrio shapely>=2.0
          python -m compileall -q scripts/research_audit/geometry_bridge_validation.py
      - name: Retrieve exact original public, non-commercial Michigan source bytes
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python - <<'PY'
          import hashlib,urllib.request,pathlib
          src="https://raw.githubusercontent.com/eveomett-states/Michigan/main/mi.zip"
          data=urllib.request.urlopen(urllib.request.Request(src,headers={"User-Agent":"university-research-reproducibility"}),timeout=120).read()
          blob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()
          assert blob=="07bce18dabbcca9d549e28995a8156fd6978d7db",blob
          out=pathlib.Path("data/raw/mi/original_precincts.zip")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          print("Verified original county/precinct ZIP Git blob and",len(data),"bytes")
          PY
      - name: Prove node-polygon alignment or report blocker without inventing mapping
        run: |
          python scripts/research_audit/geometry_bridge_validation.py \
            --graph data/raw/mi/mi/mi.json \
            --zip data/raw/mi/original_precincts.zip \
            --output outputs/research_audit/verified_precinct_bridge_geometry.json
      - name: Archive only derived distance results, not third-party polygons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-precinct-geometry-reconciliation
          retention-days: 90
          path: outputs/research_audit/verified_precinct_bridge_geometry.json
