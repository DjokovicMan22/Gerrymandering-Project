name: Stage 3 geographic proxy constrained pilot

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-geographic-pilot.yml
      - src/redistricting/ensemble/geographic.py
      - src/redistricting/ensemble/chain.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geographic-pilot:
    name: ${{ matrix.name }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: closer, seed: 101, max_cut: 760, max_counties: 18, max_mcd: 20}
          - {name: closer, seed: 202, max_cut: 760, max_counties: 18, max_mcd: 20}
          - {name: relaxed, seed: 101, max_cut: 850, max_counties: 24, max_mcd: 49}
          - {name: relaxed, seed: 202, max_cut: 850, max_counties: 24, max_mcd: 49}
    env:
      CONDITION: ${{ matrix.name }}
      SEED: ${{ matrix.seed }}
      CUT: ${{ matrix.max_cut }}
      COUNTIES: ${{ matrix.max_counties }}
      MCD: ${{ matrix.max_mcd }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m compileall -q src/redistricting/ensemble scripts/run_baseline.py scripts/research_audit/verify_snapshots.py
      - name: Verify source graph prior to any sampling
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python scripts/research_audit/verify_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --expected-git-blob a4dfe70818f87b97924781216f3d86a672cfc66a \
            --expected-nodes 4756 --expected-population 10077331 \
            --output "outputs/research_audit/pilot_source_${CONDITION}_seed${SEED}.json"
      - name: Execute geographic-constrained ReCom pilot
        run: |
          python scripts/run_baseline.py \
            --state mi --election 2020 --epsilon 0.005 \
            --steps 600 --seed "$SEED" \
            --chain-id "geopilot_${CONDITION}_seed${SEED}" \
            --snapshot-interval 10 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD"
      - name: Independently validate geographic constraint at each saved state
        run: |
          STEM="mi_2020_geopilot_${CONDITION}_seed${SEED}_600steps_seed${SEED}"
          CHAIN_DIR="outputs/chains/week4"
          python scripts/research_audit/verify_snapshots.py \
            --graph data/raw/mi/mi/mi.json --epsilon 0.005 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --assignments "$CHAIN_DIR/${STEM}_assignments.json" \
            --metric-files "$CHAIN_DIR/${STEM}_plan_metrics.csv" \
            --output "outputs/research_audit/geopilot_${CONDITION}_seed${SEED}_validated.csv"
      - name: Report movement and geography without claiming convergence
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          condition, seed = os.environ["CONDITION"], os.environ["SEED"]
          path = Path(f"outputs/chains/week4/mi_2020_geopilot_{condition}_seed{seed}_600steps_seed{seed}_plan_metrics.csv")
          df = pd.read_csv(path)
          post = df[df["step"] >= 100]
          cols = ["dem_seats", "efficiency_gap", "cut_edges", "split_counties",
                  "split_county_mcd", "state_changed_since_previous"]
          summary = {"condition":condition,"seed":int(seed),"states":len(df),
                     "post_burnin_states":len(post),
                     "distinct_metric_tuples":len(post[cols[:-1]].drop_duplicates())}
          summary.update({f"mean_{x}":float(post[x].mean()) for x in cols})
          summary["geographic_attempts"] = int(df["geographic_proposals_attempted_total"].iloc[-1])
          summary["geographic_rejections"] = int(df["geographic_proposals_rejected_total"].iloc[-1])
          summary["geographic_rejection_fraction"] = (summary["geographic_rejections"] / summary["geographic_attempts"]
                                                     if summary["geographic_attempts"] else float("nan"))
          summary.update({f"max_{x}":int(df[x].max()) for x in
                          ("cut_edges","split_counties","split_county_mcd")})
          summary["source_note"] = "One proposal per counted transition; geographic rejection is self-loop; fixed enacted start; not convergence or legal validity."
          print(summary)
          out=Path(f"outputs/research_audit/geopilot_{condition}_seed{seed}_summary.csv")
          out.parent.mkdir(parents=True,exist_ok=True)
          pd.DataFrame([summary]).to_csv(out,index=False)
          PY
      - name: Upload only derived model metrics and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-geographic-${{ matrix.name }}-${{ matrix.seed }}
          retention-days: 60
          if-no-files-found: warn
          path: |
            outputs/research_audit/**
            outputs/chains/week4/mi_2020_geopilot_*_plan_metrics.csv
            outputs/chains/week4/mi_2020_geopilot_*_metadata.json
