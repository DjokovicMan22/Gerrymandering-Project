name: Stage 3 independent-endpoint finite-horizon research validation

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-finite-horizon-ensemble.yml
      - scripts/research_audit/build_geometric_knn_graph.py
      - scripts/research_audit/finite_horizon_endpoints.py
      - scripts/research_audit/analyze_finite_horizon.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-trajectories:
    name: ${{ matrix.condition }} seeds ${{ matrix.first }} to ${{ matrix.last }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {condition: closer, first: 10001, last: 10008, cut: 760, counties: 18, mcd: 20}
          - {condition: closer, first: 10009, last: 10016, cut: 760, counties: 18, mcd: 20}
          - {condition: closer, first: 10017, last: 10024, cut: 760, counties: 18, mcd: 20}
          - {condition: closer, first: 10025, last: 10032, cut: 760, counties: 18, mcd: 20}
          - {condition: relaxed, first: 10001, last: 10008, cut: 850, counties: 24, mcd: 49}
          - {condition: relaxed, first: 10009, last: 10016, cut: 850, counties: 24, mcd: 49}
          - {condition: relaxed, first: 10017, last: 10024, cut: 850, counties: 24, mcd: 49}
          - {condition: relaxed, first: 10025, last: 10032, cut: 850, counties: 24, mcd: 49}
    env:
      CONDITION: ${{ matrix.condition }}
      FIRST: ${{ matrix.first }}
      CUT: ${{ matrix.cut }}
      COUNTIES: ${{ matrix.counties }}
      MCD: ${{ matrix.mcd }}
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Pin core stochastic and geometry dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install geopandas pyogrio "shapely>=2.0"
          python -m pip freeze > "runtime_${CONDITION}_${FIRST}.txt"
          python -m compileall -q scripts/research_audit/finite_horizon_endpoints.py
      - name: Retrieve exactly matched original VTD graph and GIS zip
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python - <<'PY'
          import pathlib,urllib.request,hashlib
          url="https://raw.githubusercontent.com/eveomett-states/Michigan/main/mi.zip"
          data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"independent-redistricting-research"}),timeout=120).read()
          digest=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()
          if digest!="07bce18dabbcca9d549e28995a8156fd6978d7db":
              raise ValueError(f"Non-identical precinct ZIP: {digest}")
          file=pathlib.Path("data/raw/mi/original_precincts.zip")
          file.parent.mkdir(parents=True,exist_ok=True)
          file.write_bytes(data)
          PY
      - name: Independently regenerate K=3 source-geometry adjacency and validate enacted contiguity
        run: |
          python scripts/research_audit/build_geometric_knn_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --zip data/raw/mi/original_precincts.zip \
            --k 3 \
            --out-graph data/raw/mi/mi/mi_knn3.json \
            --out-manifest "outputs/research_audit/finite_geometry_${CONDITION}_${FIRST}.json"
      - name: Run eight separately seeded 801-recorded-state perturbations, retain only independently rescored endpoints
        run: |
          python scripts/research_audit/finite_horizon_endpoints.py \
            --graph data/raw/mi/mi/mi_knn3.json \
            --manifest "outputs/research_audit/finite_geometry_${CONDITION}_${FIRST}.json" \
            --condition "$CONDITION" --seed-first "$FIRST" --count 8 \
            --total-steps 801 --epsilon 0.005 \
            --max-cut-edges "$CUT" --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --output "outputs/research_audit/finite_horizon_${CONDITION}_${FIRST}.csv"
      - name: Confirm an exact-seed second-process replay for the preregistered first seed
        if: matrix.first == 10001
        run: |
          python scripts/research_audit/finite_horizon_endpoints.py \
            --graph data/raw/mi/mi/mi_knn3.json \
            --manifest "outputs/research_audit/finite_geometry_${CONDITION}_${FIRST}.json" \
            --condition "$CONDITION" --seed-first "$FIRST" --count 1 \
            --total-steps 801 --epsilon 0.005 \
            --max-cut-edges "$CUT" --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --output "outputs/research_audit/replayed_${CONDITION}_${FIRST}.csv"
          python - <<'PY'
          import pandas as pd,os
          cond,seed=os.environ["CONDITION"],os.environ["FIRST"]
          a=pd.read_csv(f"outputs/research_audit/finite_horizon_{cond}_{seed}.csv").iloc[[0]].reset_index(drop=True)
          b=pd.read_csv(f"outputs/research_audit/replayed_{cond}_{seed}.csv")
          pd.testing.assert_frame_equal(a,b,check_exact=True)
          print("PASS independent-process seed replay of endpoint SHA and every recorded score")
          PY
      - name: Publish derived endpoints and source-geometry manifest, never original third-party data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-finite-horizon-${{ matrix.condition }}-${{ matrix.first }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            outputs/research_audit/finite_horizon_${{ matrix.condition }}_${{ matrix.first }}.csv
            outputs/research_audit/finite_geometry_${{ matrix.condition }}_${{ matrix.first }}.json
            runtime_${{ matrix.condition }}_${{ matrix.first }}.txt

  independent-endpoint-analysis:
    name: Model-conditional 64-endpoint uncertainty, not legal-plan p-values
    needs: independent-trajectories
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis environment
        run: python -m pip install numpy pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: stage3-finite-horizon-*
          merge-multiple: true
          path: downloaded
      - name: Strictly check sample identities and generate bootstrap uncertainty conditional on the algorithm
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t closer < <(find downloaded -type f -name 'finite_horizon_closer_*.csv' | sort)
          mapfile -t relaxed < <(find downloaded -type f -name 'finite_horizon_relaxed_*.csv' | sort)
          if [ "${#closer[@]}" -ne 4 ] || [ "${#relaxed[@]}" -ne 4 ]; then
            echo "Missing independent replicate cohort" >&2
            exit 1
          fi
          python scripts/research_audit/analyze_finite_horizon.py \
            --closer "${closer[@]}" --relaxed "${relaxed[@]}" \
            --out outputs/research_audit/final_stage3_finite_horizon_summary.json
          echo "32 independently rescored endpoints per condition; finite-horizon algorithm-defined output distribution, NOT a legal or stationary map probability." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain model-conditional estimates, finite-sample Monte Carlo intervals, and full nonidentifying endpoint metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-finite-horizon-final-methodological-outcomes
          retention-days: 90
          if-no-files-found: warn
          path: |
            outputs/research_audit/final_stage3_finite_horizon_summary.json
            outputs/research_audit/independent_endpoints_64.csv
