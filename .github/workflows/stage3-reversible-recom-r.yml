name: Stage 3 reversible spanning-tree ReCom R move-rate pilot

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-reversible-recom-r.yml
      - scripts/research_audit/pilot_reversible_recom.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-variant-r:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {condition: closer, cut: 760, counties: 18, mcd: 20, sample_seed: 9901}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, sample_seed: 9902}
    env:
      CONDITION: ${{ matrix.condition }}
      CUT: ${{ matrix.cut }}
      COUNTIES: ${{ matrix.counties }}
      MCD: ${{ matrix.mcd }}
      SAMPLE_SEED: ${{ matrix.sample_seed }}
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and pin runtime
        run: |
          python -m pip install -e ".[dev]"
          python -m pip freeze > pinned-runtime.txt
      - name: Fetch and verify pinned source
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python scripts/research_audit/verify_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --expected-git-blob a4dfe70818f87b97924781216f3d86a672cfc66a \
            --expected-nodes 4756 --expected-population 10077331 \
            --output outputs/research_audit/recom_r_graph.json
      - name: Execute 200 published reversible ReCom variant-R proposals on historical graph
        run: |
          python scripts/research_audit/pilot_reversible_recom.py \
            --graph data/raw/mi/mi/mi.json \
            --condition "$CONDITION" --warm-seed 101 --sample-seed "$SAMPLE_SEED" \
            --steps 201 --cut-cap 20 \
            --max-cut-edges "$CUT" --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --out "outputs/research_audit/reversible_recom_r_${CONDITION}_pilot.json"
      - name: Preserve derived diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-reversible-recom-r-${{ matrix.condition }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            outputs/research_audit/reversible_recom_r_*_pilot.json
            pinned-runtime.txt
