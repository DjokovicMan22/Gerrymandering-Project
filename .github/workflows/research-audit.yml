name: Research audit tests

on:
  push:
    branches:
      - research/stages-1-3-validation
  pull_request:
    paths:
      - scripts/research_audit/**
      - tests/test_research_audit.py
      - tests/test_geographic_constraints.py
      - tests/test_start_diversity.py
      - tests/test_diversified_sampling.py
      - tests/test_diversified_spatial.py
      - tests/test_reversible_kernel.py
      - tests/test_reversible_mixing.py
      - tests/test_bridge_geography_audit.py
      - tests/test_finite_horizon.py
      - src/redistricting/ensemble/**
      - .github/workflows/research-audit.yml

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight testing dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy pandas networkx gerrychain
      - name: Run Stage 1-3 synthetic validation tests
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/redistricting/ensemble scripts/run_baseline.py
          python -m pytest tests/test_research_audit.py tests/test_geographic_constraints.py tests/test_start_diversity.py tests/test_diversified_sampling.py tests/test_diversified_spatial.py tests/test_reversible_kernel.py tests/test_reversible_mixing.py tests/test_bridge_geography_audit.py tests/test_finite_horizon.py -q
