name: Stage 3 proposed proximity graph enacted contiguity validation

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-topology-gate.yml
      - scripts/research_audit/validate_candidate_topology.py
      - configs/mi_geometry_component_candidates.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-topology-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned research environment
        run: python -m pip install -e ".[dev]"
      - name: Obtain exact source and audit candidate independently of political labels
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python scripts/research_audit/validate_candidate_topology.py \
            --graph data/raw/mi/mi/mi.json \
            --manifest configs/mi_geometry_component_candidates.json \
            --out outputs/research_audit/geometry_candidate_reference_topology.json
      - name: Report whether reference can be scored on a valid model graph
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path("outputs/research_audit/geometry_candidate_reference_topology.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"**{result['scientific_gate']}**\n\n")
              f.write(f"Disconnected reference districts: {[k for k,v in result['per_enacted_district'].items() if not v['connected_under_candidate_graph']]}\n\n")
              f.write("Do not silently connect disconnected reference pieces by enacted-district label.\n")
          print(result["scientific_gate"])
          PY
      - name: Upload topology audit, not third-party precinct graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-proximity-graph-enacted-reference-validity
          retention-days: 90
          path: outputs/research_audit/geometry_candidate_reference_topology.json
