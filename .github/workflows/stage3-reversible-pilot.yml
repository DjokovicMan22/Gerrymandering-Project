name: Stage 3 mathematically reversible Michigan MH feasibility pilot

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-reversible-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reversible-local-pilot:
    name: ${{ matrix.condition }} MH seed ${{ matrix.warm_seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {condition: closer, cut: 760, counties: 18, mcd: 20, warm_seed: 101, sample_seed: 7101, hash: "a1cb09ace3596f11531170c14d8ed18a125d0acd7404cccb15df61956ddfa910"}
          - {condition: closer, cut: 760, counties: 18, mcd: 20, warm_seed: 202, sample_seed: 7202, hash: "1bfdc79ef1ed8862cb1ac03bbcfe9cae02ba923128c9784dce56cc050b9112e0"}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, warm_seed: 101, sample_seed: 7101, hash: "fa6d219689c0fe1d47c1306bfb10a81cea59c1dd150be27e4f480ded14cf4287"}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, warm_seed: 202, sample_seed: 7202, hash: "031abb8e1e1d7fdd58ea39193482c9d87da34b062646d7fcb24eb5c3e563cdf8"}
    env:
      CONDITION: ${{ matrix.condition }}
      CUT: ${{ matrix.cut }}
      COUNTIES: ${{ matrix.counties }}
      MCD: ${{ matrix.mcd }}
      WARM_SEED: ${{ matrix.warm_seed }}
      SAMPLE_SEED: ${{ matrix.sample_seed }}
      START_HASH: ${{ matrix.hash }}
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned GerryChain and test exact detailed balance
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip freeze > pinned-runtime.txt
          PYTHONPATH=src python -m pytest tests/test_reversible_kernel.py -q
          python -m compileall -q src/redistricting/ensemble/reversible.py scripts/research_audit/run_reversible_pilot.py
      - name: Fetch pinned public graph
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python scripts/research_audit/verify_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --expected-git-blob a4dfe70818f87b97924781216f3d86a672cfc66a \
            --expected-nodes 4756 --expected-population 10077331 \
            --output "outputs/research_audit/reversible_source_${CONDITION}_${WARM_SEED}.json"
      - name: Reproduce exact warm start then sample 2000 MH transitions
        run: |
          python scripts/research_audit/run_reversible_pilot.py \
            --graph data/raw/mi/mi/mi.json \
            --output-root outputs/research_audit/reversible_pilot \
            --condition "$CONDITION" \
            --warm-seed "$WARM_SEED" --sample-seed "$SAMPLE_SEED" \
            --expected-warm-sha "$START_HASH" \
            --warm-steps 800 --states 2001 --snapshot-interval 100 \
            --epsilon 0.005 --flip-probability 0.5 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD"
      - name: Independently verify 21 saved full assignments per MH chain
        run: |
          STEM="mi_2020_reversible_${CONDITION}_warm${WARM_SEED}_sample${SAMPLE_SEED}_2001states"
          DIR=outputs/research_audit/reversible_pilot/chains
          python scripts/research_audit/verify_snapshots.py \
            --graph data/raw/mi/mi/mi.json --epsilon 0.005 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --assignments "$DIR/${STEM}_assignments.json" \
            --metric-files "$DIR/${STEM}_plan_metrics.csv" \
            --output "outputs/research_audit/reversible_pilot/reports/${STEM}_verified.csv"
      - name: Preserve derived statistics, proofs/test logs and reproducibility metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-reversible-${{ matrix.condition }}-${{ matrix.warm_seed }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            pinned-runtime.txt
            outputs/research_audit/reversible_source_*.json
            outputs/research_audit/reversible_pilot/chains/*_plan_metrics.csv
            outputs/research_audit/reversible_pilot/chains/*_metadata.json
            outputs/research_audit/reversible_pilot/reports/
