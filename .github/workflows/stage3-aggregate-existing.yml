name: Stage 3 aggregate existing production outputs

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - docs/research_audit/trigger_stage3_aggregate.txt

permissions:
  contents: read
  actions: read

jobs:
  reuse-produced-chain-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORIGINAL_RUN_ID: "39120743275"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install postprocessing requirements
        run: python -m pip install --disable-pip-version-check pandas numpy arviz
      - name: Download original production artifacts without rerunning chains
        uses: actions/download-artifact@v4
        with:
          run-id: 39120743275
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: stage3-prod-*
          merge-multiple: true
          path: downloaded
      - name: Verify all eight score histories and analyze matched budgets
        shell: bash
        run: |
          set -euo pipefail
          count=$(find downloaded -type f -name "mi_2020_stage3eps*_plan_metrics.csv" | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "ERROR: expected 8 independent per-run plan-metric CSVs, got $count" >&2
            exit 1
          fi
          gates_failed=0
          for eps in 0.005 0.02; do
            tag="${eps//./p}"
            mapfile -t files < <(find downloaded -type f -name "mi_2020_stage3eps${tag}_chain*_plan_metrics.csv" | sort)
            if [ "${#files[@]}" -ne 4 ]; then
              echo "ERROR: expected 4 seeded chains at epsilon $eps, got ${#files[@]}" >&2
              exit 1
            fi
            set +e
            python scripts/research_audit/analyze_chains.py \
              --chains "${files[@]}" --burn-in 2000 --epsilon "$eps" \
              --out "outputs/research_audit/production/epsilon_$eps"
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              gates_failed=1
              echo "NOT CERTIFIED: convergence gates fail under epsilon $eps"
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            {
              echo "### Epsilon ±$(awk "BEGIN {print 100*$eps}")%"
              echo ""
              echo "Four seeds; 6,000 correlated post-burn-in states each."
              echo ""
              echo '~~~'
              cat "outputs/research_audit/production/epsilon_$eps/diagnostics.csv"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$gates_failed" -eq 1 ]; then
            echo "Scalar convergence gate failed; no stationary-ensemble certification." | tee outputs/research_audit/production/convergence_status.txt
          else
            echo "Scalar gates passed; geographic and high-dimensional validity remain unverified." | tee outputs/research_audit/production/convergence_status.txt
          fi
      - name: Archive derived cross-chain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-aggregated-convergence-and-ESS
          retention-days: 90
          if-no-files-found: warn
          path: outputs/research_audit/production/**
