name: Stage 3 postprocess exact spatial movement without rerunning chains

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-diverse-spatial-aggregate.yml
      - scripts/research_audit/analyze_diversified_spatial.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate-existing-spatial-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORIGINAL_PRODUCTION_RUN_ID: "39162686274"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis-only dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Wait for all eight verified production archive uploads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 95); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_PRODUCTION_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[].name | select(startswith("stage3-diverse-prod-"))] | length')
            if [ "$count" -eq 8 ]; then
              echo "All eight archives are present; reading only stored derived spatial probes."
              exit 0
            fi
            echo "$count/8 production artifacts available."
            sleep 60
          done
          echo "Incomplete input: refuse to analyze missing chains" >&2
          exit 1
      - name: Download existing derived reports without sampling a single new map
        uses: actions/download-artifact@v4
        with:
          run-id: 39162686274
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: stage3-diverse-prod-*
          merge-multiple: true
          path: downloaded
      - name: Summarize five label-invariant checkpoints by geographic condition
        shell: bash
        run: |
          set -euo pipefail
          for condition in closer relaxed; do
            mapfile -t probes < <(find downloaded -type f -name "mi_2020_diverse_${condition}_warm*_spatial_probes.csv" | sort)
            if [ "${#probes[@]}" -ne 4 ]; then
              echo "Need exactly 4 spatial-probe archives per condition, found ${#probes[@]}" >&2
              exit 1
            fi
            python scripts/research_audit/analyze_diversified_spatial.py \
              --probes "${probes[@]}" \
              --condition "$condition" \
              --out "outputs/research_audit/diverse_spatial_aggregate/$condition"
            echo "### $condition spatial checkpoint movement" >> "$GITHUB_STEP_SUMMARY"
            cat "outputs/research_audit/diverse_spatial_aggregate/$condition/spatial_checkpoints_summary.csv" >> "$GITHUB_STEP_SUMMARY"
            echo "These are reference/start distances only; NOT inter-chain pairwise map distances or spatial convergence." >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Save spatial summaries and limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-diversified-spatial-checkpoints
          retention-days: 90
          if-no-files-found: warn
          path: outputs/research_audit/diverse_spatial_aggregate/
