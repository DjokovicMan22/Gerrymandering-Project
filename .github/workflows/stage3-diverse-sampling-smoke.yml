name: Stage 3 diversified-start sampling smoke

on:
  push:
    branches:
      - research/stages-1-3-validation
    paths:
      - .github/workflows/stage3-diverse-sampling-smoke.yml
      - scripts/research_audit/run_diversified_chains.py
      - src/redistricting/ensemble/start_diversity.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-warmup-to-sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {condition: closer, cut: 760, counties: 18, mcd: 20, expected: "5b3887cae71a45fb74a592646c444d040c44eb144b0f4ffe60e576fa15bc2fcb"}
          - {condition: relaxed, cut: 850, counties: 24, mcd: 49, expected: "0649670be165473f896e8ed9df3a836abb69ba7631390cb25351b5cb6c40459a"}
    env:
      CONDITION: ${{ matrix.condition }}
      CUT: ${{ matrix.cut }}
      COUNTIES: ${{ matrix.counties }}
      MCD: ${{ matrix.mcd }}
      WARM_HASH: ${{ matrix.expected }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          PYTHONPATH=src python -m pytest tests/test_diversified_sampling.py -q
      - name: Fetch source with pinned hash
        run: |
          python scripts/research_audit/download_source.py --acknowledge-source-terms
          python scripts/research_audit/verify_graph.py \
            --graph data/raw/mi/mi/mi.json \
            --expected-git-blob a4dfe70818f87b97924781216f3d86a672cfc66a \
            --expected-nodes 4756 --expected-population 10077331 \
            --output "outputs/research_audit/diverse_smoke_source_${CONDITION}.json"
      - name: Reconstruct exact verified 800-state warm start, then independently seed sampling
        run: |
          python scripts/research_audit/run_diversified_chains.py \
            --graph data/raw/mi/mi/mi.json \
            --output-root outputs/research_audit/diverse_smoke \
            --condition "$CONDITION" \
            --warm-seed 101 --sample-seed 1101 \
            --warm-steps 800 --steps 101 --burn-in 20 \
            --snapshot-interval 10 --epsilon 0.005 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --expected-warm-hash "$WARM_HASH" \
            --min-initial-distance 0.05
      - name: Independently verify sampled warm-origin snapshots against saved metrics
        run: |
          STEM="mi_2020_diverse_${CONDITION}_warm101_sample1101_101steps"
          DIR=outputs/research_audit/diverse_smoke/chains
          python scripts/research_audit/verify_snapshots.py \
            --graph data/raw/mi/mi/mi.json --epsilon 0.005 \
            --max-cut-edges "$CUT" \
            --max-split-counties "$COUNTIES" \
            --max-split-county-mcd "$MCD" \
            --assignments "$DIR/${STEM}_assignments.json" \
            --metric-files "$DIR/${STEM}_plan_metrics.csv" \
            --output "outputs/research_audit/diverse_smoke/reports/${STEM}_verified.csv"
      - name: Upload derived metrics and reproducibility manifests only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-diverse-smoke-${{ matrix.condition }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            outputs/research_audit/diverse_smoke/reports/
            outputs/research_audit/diverse_smoke/chains/*_plan_metrics.csv
            outputs/research_audit/diverse_smoke/chains/*_metadata.json
